<div class="admin-form-container">
  <div class="form-header">
    <div class="header-title">
      <h3>
        {{
          (isAdd
            ? "PRODUCT_COLLECTION.ADD_NEW_COLLECTION"
            : "PRODUCT_COLLECTION.EDIT_COLLECTION")
            | translate
        }}
      </h3>
      <p>
        {{
          (isAdd
            ? "PRODUCT_COLLECTION.CREATE_COLLECTION_DESC"
            : "PRODUCT_COLLECTION.EDIT_COLLECTION_DESC")
            | translate
        }}
      </p>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="collectionForm" (ngSubmit)="save()">
      <div class="row g-4">
        <div class="col-12 col-lg-7">
          <div class="form-section">
            <h3 class="form-section-title">
              <mat-icon>edit_note</mat-icon>
              {{ "PRODUCT_COLLECTION.BASIC_INFORMATION" | translate }}
            </h3>
            <div class="form-grid">
              <ng-container formGroupName="name">
                <div class="form-group">
                  <label>{{ "PRODUCT_COLLECTION.COLLECTION_NAME_EN" | translate }}</label>
                  <div class="input-wrapper">
                    <input
                      type="text"
                      formControlName="english"
                      [placeholder]="'PRODUCT_COLLECTION.COLLECTION_NAME_EN_PLACEHOLDER' | translate"
                    />
                  </div>
                  <app-form-error
                    [control]="collectionForm.get('name.english')!"
                  ></app-form-error>
                </div>
                <div class="form-group" dir="rtl">
                  <label>{{ "PRODUCT_COLLECTION.COLLECTION_NAME_AR" | translate }}</label>
                  <div class="input-wrapper">
                    <input
                      type="text"
                      formControlName="arabic"
                      [placeholder]="'PRODUCT_COLLECTION.COLLECTION_NAME_AR_PLACEHOLDER' | translate"
                    />
                  </div>
                  <app-form-error
                    [control]="collectionForm.get('name.arabic')!"
                  ></app-form-error>
                </div>
              </ng-container>

              <ng-container formGroupName="description">
                <div class="form-group">
                  <label>{{ "PRODUCT_COLLECTION.DESCRIPTION_EN" | translate }}</label>
                  <div class="input-wrapper">
                    <textarea
                      formControlName="english"
                      [rows]="4"
                      [placeholder]="'PRODUCT_COLLECTION.DESCRIPTION_PLACEHOLDER' | translate"
                    ></textarea>
                  </div>
                </div>
                <div class="form-group" dir="rtl">
                  <label>{{ "PRODUCT_COLLECTION.DESCRIPTION_AR" | translate }}</label>
                  <div class="input-wrapper">
                    <textarea
                      formControlName="arabic"
                      [rows]="4"
                      [placeholder]="'PRODUCT_COLLECTION.DESCRIPTION_PLACEHOLDER' | translate"
                    ></textarea>
                  </div>
                </div>
              </ng-container>

              <div class="form-group">
                <label>{{ "general.sortOrder" | translate }}</label>
                <div class="input-wrapper">
                  <input type="number" formControlName="sortOrder" />
                </div>
                <app-form-error
                  [control]="collectionForm.get('sortOrder')!"
                  fieldName="{{ 'general.sortOrder' | translate }}"
                ></app-form-error>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <app-view-product-collection-selector
            [productsSelected]="productsSelected"
            (onAddProductClicked)="openAddProductDialog()"
            (onDeleteProduct)="removeProduct($event)"
          ></app-view-product-collection-selector>
        </div>
      </div>

      <div class="btn-container">
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          {{ "general.back" | translate }}
        </button>
        <button type="submit" class="btn btn-primary mx-2" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ "general.save" | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
